services:
  withings2mqtt:
    build: .
    image: withings2mqtt:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WITHINGS2MQTT_HTTP_PORT:-8080}:8080"
    environment:
      WITHINGS2MQTT_TOKEN_ENCRYPTION_KEY: ${WITHINGS2MQTT_TOKEN_ENCRYPTION_KEY:?Set WITHINGS2MQTT_TOKEN_ENCRYPTION_KEY to a base64-encoded 32-byte key}
      WITHINGS2MQTT_ADMIN_ALLOW_REMOTE: "true"
      WITHINGS2MQTT_WITHINGS_CLIENT_ID: ${WITHINGS2MQTT_WITHINGS_CLIENT_ID:-}
      WITHINGS2MQTT_WITHINGS_CLIENT_SECRET: ${WITHINGS2MQTT_WITHINGS_CLIENT_SECRET:-}
      WITHINGS2MQTT_WITHINGS_REDIRECT_URL: ${WITHINGS2MQTT_WITHINGS_REDIRECT_URL:-}
    volumes:
      - withings2mqtt-data:/data

volumes:
  withings2mqtt-data:
